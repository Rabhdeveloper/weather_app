<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSphere Pro | Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2d6ee0;
            --secondary: #1a459c;
            --accent: #4c8bf5;
            --light: #f8f9fa;
            --dark: #212529;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --gray: #6c757d;
            --card-bg: rgba(255, 255, 255, 0.92);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(120deg, #1a459c 0%, #2d6ee0 50%, #4c8bf5 100%);
            min-height: 100vh;
            color: var(--light);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.05" d="M0,128L48,117.3C96,107,192,85,288,112C384,139,480,213,576,218.7C672,224,768,160,864,138.7C960,117,1056,139,1152,149.3C1248,160,1344,160,1392,160L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
            background-position: bottom;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
        }

        .logo i {
            color: var(--warning);
        }

        .search-container {
            display: flex;
            background: var(--card-bg);
            border-radius: 50px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        #location-input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            font-size: 16px;
            outline: none;
            color: var(--dark);
            min-width: 250px;
        }

        #search-btn {
            padding: 12px 20px;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: var(--transition);
        }

        #search-btn:hover {
            background: var(--secondary);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 900px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .current-weather {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            color: var(--dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .current-weather::before {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%232d6ee0" fill-opacity="0.05" d="M0,128L48,117.3C96,107,192,85,288,112C384,139,480,213,576,218.7C672,224,768,160,864,138.7C960,117,1056,139,1152,149.3C1248,160,1344,160,1392,160L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>');
            background-size: cover;
            background-position: bottom;
            z-index: 0;
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .location h2 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .date {
            color: var(--gray);
            font-size: 14px;
        }

        .temp-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .weather-icon {
            width: 100px;
            height: 100px;
            margin-right: 15px;
        }

        .temperature {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
        }

        .unit {
            font-size: 24px;
            vertical-align: super;
            font-weight: 500;
        }

        .condition {
            font-size: 20px;
            margin-bottom: 25px;
            text-transform: capitalize;
            position: relative;
            z-index: 1;
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            position: relative;
            z-index: 1;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail-card i {
            font-size: 24px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .detail-card .value {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .detail-card .label {
            font-size: 14px;
            color: var(--gray);
        }

        .forecast {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            color: var(--dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 22px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
        }

        .forecast-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.5);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            transition: var(--transition);
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .forecast-date {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .forecast-icon {
            width: 50px;
            height: 50px;
            margin: 10px auto;
        }

        .forecast-temp {
            font-size: 20px;
            font-weight: 700;
        }

        .forecast-condition {
            font-size: 14px;
            color: var(--gray);
            margin-top: 5px;
        }

        .additional-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            color: var(--dark);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .info-card h3 {
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(0, 0, 0, 0.1);
        }

        .hourly-forecast {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 5px 0;
        }

        .hourly-item {
            flex: 0 0 auto;
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            min-width: 80px;
        }

        .hourly-time {
            font-weight: 600;
            font-size: 14px;
        }

        .hourly-icon {
            width: 40px;
            height: 40px;
            margin: 5px auto;
        }

        .hourly-temp {
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--light);
            font-size: 18px;
        }

        .loading i {
            display: block;
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--warning);
        }

        .error-message {
            background: var(--danger);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            display: none;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--light);
            opacity: 0.8;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
            }
            
            #location-input {
                min-width: auto;
            }
            
            .temp-container {
                flex-direction: column;
                text-align: center;
            }
            
            .weather-icon {
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-cloud-sun"></i>
                <span>WeatherSphere Pro</span>
            </div>
            <div class="search-container">
                <input type="text" id="location-input" placeholder="Search for a city or country...">
                <button id="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </header>

        <div class="error-message" id="error-message"></div>

        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading weather data...</p>
        </div>

        <div id="weather-content" style="display: none;">
            <div class="main-content">
                <div class="current-weather">
                    <div class="weather-header">
                        <div class="location">
                            <h2 id="location">--</h2>
                            <div class="date" id="date">--</div>
                        </div>
                        <div class="last-updated" id="last-updated">Just now</div>
                    </div>

                    <div class="temp-container">
                        <img id="weather-icon" class="weather-icon" src="" alt="Weather icon">
                        <div class="temperature">
                            <span id="temp">--</span><span class="unit">°C</span>
                        </div>
                    </div>

                    <div class="condition" id="condition">--</div>

                    <div class="weather-details">
                        <div class="detail-card">
                            <i class="fas fa-wind"></i>
                            <div class="value" id="wind">-- km/h</div>
                            <div class="label">Wind Speed</div>
                        </div>
                        <div class="detail-card">
                            <i class="fas fa-tint"></i>
                            <div class="value" id="humidity">--%</div>
                            <div class="label">Humidity</div>
                        </div>
                        <div class="detail-card">
                            <i class="fas fa-compress-alt"></i>
                            <div class="value" id="pressure">-- hPa</div>
                            <div class="label">Pressure</div>
                        </div>
                        <div class="detail-card">
                            <i class="fas fa-eye"></i>
                            <div class="value" id="visibility">-- km</div>
                            <div class="label">Visibility</div>
                        </div>
                    </div>
                </div>

                <div class="forecast">
                    <h3 class="section-title">5-Day Forecast</h3>
                    <div class="forecast-cards" id="forecast-container">
                        <!-- Forecast cards will be inserted here -->
                    </div>
                </div>
            </div>

            <div class="additional-info">
                <div class="info-card">
                    <h3>Hourly Forecast</h3>
                    <div class="hourly-forecast" id="hourly-forecast">
                        <!-- Hourly forecast items will be inserted here -->
                    </div>
                </div>
                <div class="info-card">
                    <h3>Air Quality</h3>
                    <div class="air-quality" id="air-quality">
                        <div class="detail-card">
                            <i class="fas fa-smog"></i>
                            <div class="value" id="aqi">--</div>
                            <div class="label">AQI Index</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Powered by WeatherAPI.com | © 2023 WeatherSphere Pro</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM Elements
            const locationInput = document.getElementById('location-input');
            const searchBtn = document.getElementById('search-btn');
            const locationElement = document.getElementById('location');
            const dateElement = document.getElementById('date');
            const tempElement = document.getElementById('temp');
            const conditionElement = document.getElementById('condition');
            const weatherIcon = document.getElementById('weather-icon');
            const windElement = document.getElementById('wind');
            const humidityElement = document.getElementById('humidity');
            const pressureElement = document.getElementById('pressure');
            const visibilityElement = document.getElementById('visibility');
            const aqiElement = document.getElementById('aqi');
            const errorMessage = document.getElementById('error-message');
            const loadingElement = document.getElementById('loading');
            const weatherContent = document.getElementById('weather-content');
            const forecastContainer = document.getElementById('forecast-container');
            const hourlyForecastContainer = document.getElementById('hourly-forecast');
            const lastUpdatedElement = document.getElementById('last-updated');
            
            // API Configuration
            const apiKey = 'e0e0bad5d7eb4a54afa182250250208';
            const baseUrl = 'https://api.weatherapi.com/v1';
            
            // Fetch weather data
            async function fetchWeather(location) {
                try {
                    showLoading();
                    
                    const response = await fetch(`${baseUrl}/current.json?key=${apiKey}&q=${encodeURIComponent(location)}&aqi=yes`);
                    
                    if (!response.ok) {
                        throw new Error('Location not found. Please try another city or country.');
                    }
                    
                    const data = await response.json();
                    displayWeather(data);
                    hideError();
                    
                    // For demonstration purposes, generate forecast data
                    generateForecastData(data);
                    generateHourlyData();
                    
                } catch (err) {
                    showError(err.message);
                    console.error('Error fetching weather data:', err);
                } finally {
                    hideLoading();
                }
            }
            
            // Display weather data
            function displayWeather(data) {
                const { location, current } = data;
                
                // Location and date
                locationElement.textContent = `${location.name}, ${location.country}`;
                dateElement.textContent = new Date(location.localtime).toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                lastUpdatedElement.textContent = `Updated: ${new Date().toLocaleTimeString()}`;
                
                // Temperature and condition
                tempElement.textContent = Math.round(current.temp_c);
                conditionElement.textContent = current.condition.text;
                
                // Weather icon
                weatherIcon.src = current.condition.icon;
                weatherIcon.alt = current.condition.text;
                
                // Additional details
                windElement.textContent = `${current.wind_kph} km/h`;
                humidityElement.textContent = `${current.humidity}%`;
                pressureElement.textContent = `${current.pressure_mb} hPa`;
                visibilityElement.textContent = `${current.vis_km} km`;
                
                // Air quality
                if (current.air_quality && current.air_quality['us-epa-index']) {
                    const aqi = current.air_quality['us-epa-index'];
                    aqiElement.textContent = `${aqi} (${getAQIDescription(aqi)})`;
                } else {
                    aqiElement.textContent = 'N/A';
                }
                
                weatherContent.style.display = 'block';
            }
            
            // Generate forecast data (for demonstration)
            function generateForecastData(currentData) {
                forecastContainer.innerHTML = '';
                
                for (let i = 1; i <= 5; i++) {
                    const date = new Date();
                    date.setDate(date.getDate() + i);
                    
                    const forecastCard = document.createElement('div');
                    forecastCard.className = 'forecast-card';
                    
                    // Randomize temperature for demo (within ±5 degrees of current temp)
                    const tempVariation = (Math.random() * 10) - 5;
                    const forecastTemp = Math.round(Number(currentData.current.temp_c) + tempVariation);
                    
                    // Conditions for demo
                    const conditions = ['Sunny', 'Partly Cloudy', 'Cloudy', 'Rainy', 'Stormy'];
                    const condition = conditions[Math.floor(Math.random() * conditions.length)];
                    
                    forecastCard.innerHTML = `
                        <div class="forecast-date">${date.toLocaleDateString('en-US', { weekday: 'short' })}</div>
                        <div class="forecast-date">${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
                        <img src="${currentData.current.condition.icon}" class="forecast-icon" alt="${condition}">
                        <div class="forecast-temp">${forecastTemp}°C</div>
                        <div class="forecast-condition">${condition}</div>
                    `;
                    
                    forecastContainer.appendChild(forecastCard);
                }
            }
            
            // Generate hourly data (for demonstration)
            function generateHourlyData() {
                hourlyForecastContainer.innerHTML = '';
                
                const now = new Date();
                
                for (let i = 0; i < 12; i++) {
                    const hour = new Date(now.getTime());
                    hour.setHours(now.getHours() + i);
                    
                    const hourlyItem = document.createElement('div');
                    hourlyItem.className = 'hourly-item';
                    
                    // Randomize temperature for demo
                    const tempVariation = (Math.random() * 4) - 2;
                    const hourlyTemp = Math.round(Number(tempElement.textContent) + tempVariation);
                    
                    hourlyItem.innerHTML = `
                        <div class="hourly-time">${hour.toLocaleTimeString('en-US', { hour: 'numeric' })}</div>
                        <img src="${weatherIcon.src}" class="hourly-icon" alt="Weather">
                        <div class="hourly-temp">${hourlyTemp}°C</div>
                    `;
                    
                    hourlyForecastContainer.appendChild(hourlyItem);
                }
            }
            
            // Helper functions
            function getAQIDescription(aqi) {
                const descriptions = {
                    1: 'Good',
                    2: 'Moderate',
                    3: 'Unhealthy for sensitive groups',
                    4: 'Unhealthy',
                    5: 'Very Unhealthy',
                    6: 'Hazardous'
                };
                return descriptions[aqi] || 'Unknown';
            }
            
            function showLoading() {
                loadingElement.style.display = 'block';
                weatherContent.style.display = 'none';
            }
            
            function hideLoading() {
                loadingElement.style.display = 'none';
            }
            
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                weatherContent.style.display = 'none';
            }
            
            function hideError() {
                errorMessage.style.display = 'none';
            }
            
            // Event listeners
            searchBtn.addEventListener('click', () => {
                const location = locationInput.value.trim();
                if (location) {
                    fetchWeather(location);
                } else {
                    showError('Please enter a location');
                }
            });
            
            locationInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const location = locationInput.value.trim();
                    if (location) {
                        fetchWeather(location);
                    } else {
                        showError('Please enter a location');
                    }
                }
            });
            
            // Fetch default location (India) on page load
            fetchWeather('India');
        });
    </script>
</body>
</html>
