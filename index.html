<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #72edf2 0%, #5151e5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .search-container {
            display: flex;
            margin-bottom: 25px;
        }

        #location-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #search-btn {
            width: 50px;
            height: 50px;
            border: none;
            background-color: #5151e5;
            color: white;
            border-radius: 50%;
            margin-left: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        #search-btn:hover {
            background-color: #3a3ac7;
            transform: scale(1.05);
        }

        .weather-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .weather-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .weather-header h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .date {
            color: #666;
            font-size: 14px;
        }

        .weather-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .temperature {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .temperature img {
            width: 80px;
            height: 80px;
            margin-right: 10px;
        }

        .temperature span {
            font-size: 48px;
            font-weight: 600;
            color: #333;
        }

        .unit {
            font-size: 24px;
            vertical-align: super;
            margin-left: 2px;
        }

        .condition {
            font-size: 18px;
            color: #666;
            text-transform: capitalize;
        }

        .weather-details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .detail {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail i {
            font-size: 20px;
            color: #5151e5;
            margin-bottom: 5px;
        }

        .detail span {
            font-size: 14px;
            color: #666;
        }

        .error-message {
            color: #e74c3c;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            display: none;
        }

        .loading {
            text-align: center;
            color: #5151e5;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            
            .weather-details {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        
        <div class="search-container">
            <input type="text" id="location-input" placeholder="Enter city or country...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
        
        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i> Loading weather data...
        </div>
        
        <div class="weather-card" id="weather-card">
            <div class="weather-header">
                <h2 id="location">--</h2>
                <div class="date" id="date">--</div>
            </div>
            
            <div class="weather-main">
                <div class="temperature">
                    <img id="weather-icon" src="" alt="Weather icon">
                    <span id="temp">--</span><span class="unit">°C</span>
                </div>
                <div class="condition" id="condition">--</div>
            </div>
            
            <div class="weather-details">
                <div class="detail">
                    <i class="fas fa-wind"></i>
                    <span id="wind">-- km/h</span>
                </div>
                <div class="detail">
                    <i class="fas fa-tint"></i>
                    <span id="humidity">--%</span>
                </div>
                <div class="detail">
                    <i class="fas fa-compress-alt"></i>
                    <span id="pressure">-- hPa</span>
                </div>
            </div>
        </div>
        
        <div class="error-message" id="error-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const locationInput = document.getElementById('location-input');
            const searchBtn = document.getElementById('search-btn');
            const locationElement = document.getElementById('location');
            const dateElement = document.getElementById('date');
            const tempElement = document.getElementById('temp');
            const conditionElement = document.getElementById('condition');
            const weatherIcon = document.getElementById('weather-icon');
            const windElement = document.getElementById('wind');
            const humidityElement = document.getElementById('humidity');
            const pressureElement = document.getElementById('pressure');
            const errorMessage = document.getElementById('error-message');
            const loadingElement = document.getElementById('loading');
            const weatherCard = document.getElementById('weather-card');
            
            // API key and base URL - using HTTPS to avoid mixed content issues
            const apiKey = 'e0e0bad5d7eb4a54afa182250250208';
            const baseUrl = 'https://api.weatherapi.com/v1/current.json';
            
            // Fetch weather data
            async function fetchWeather(location) {
                try {
                    loadingElement.style.display = 'block';
                    weatherCard.style.display = 'none';
                    errorMessage.style.display = 'none';
                    
                    const response = await fetch(`${baseUrl}?key=${apiKey}&q=${encodeURIComponent(location)}&aqi=yes`);
                    
                    if (!response.ok) {
                        throw new Error('Location not found. Please try another city or country.');
                    }
                    
                    const data = await response.json();
                    displayWeather(data);
                    errorMessage.style.display = 'none';
                    weatherCard.style.display = 'block';
                } catch (err) {
                    errorMessage.textContent = err.message;
                    errorMessage.style.display = 'block';
                    weatherCard.style.display = 'none';
                    console.error('Error fetching weather data:', err);
                } finally {
                    loadingElement.style.display = 'none';
                }
            }
            
            // Display weather data
            function displayWeather(data) {
                const { location, current } = data;
                
                // Location and date
                locationElement.textContent = `${location.name}, ${location.country}`;
                dateElement.textContent = new Date(location.localtime).toLocaleDateString('en-US', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                
                // Temperature and condition
                tempElement.textContent = Math.round(current.temp_c);
                conditionElement.textContent = current.condition.text;
                
                // Weather icon
                weatherIcon.src = current.condition.icon;
                weatherIcon.alt = current.condition.text;
                
                // Additional details
                windElement.textContent = `${current.wind_kph} km/h`;
                humidityElement.textContent = `${current.humidity}%`;
                pressureElement.textContent = `${current.pressure_mb} hPa`;
            }
            
            // Event listeners
            searchBtn.addEventListener('click', () => {
                const location = locationInput.value.trim();
                if (location) {
                    fetchWeather(location);
                } else {
                    errorMessage.textContent = 'Please enter a location';
                    errorMessage.style.display = 'block';
                }
            });
            
            locationInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    const location = locationInput.value.trim();
                    if (location) {
                        fetchWeather(location);
                    } else {
                        errorMessage.textContent = 'Please enter a location';
                        errorMessage.style.display = 'block';
                    }
                }
            });
            
            // Fetch default location (India) on page load
            fetchWeather('India');
        });
    </script>
</body>
</html>
