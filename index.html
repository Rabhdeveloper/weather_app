<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeatherSphere Pro | Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-cloud-sun"></i>
                <span>WeatherSphere Pro</span>
            </div>
            <div class="search-container">
                <input type="text" id="location-input" placeholder="Search for a city or country...">
                <button id="search-btn">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </header>

        <div class="error-message" id="error-message"></div>

        <div class="loading" id="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Loading weather data...</p>
        </div>

        <div id="weather-content" style="display: none;">
            <div class="main-content">
                <div class="current-weather">
                    <div class="weather-header">
                        <div class="location">
                            <h2 id="location">--</h2>
                            <div class="date" id="date">--</div>
                        </div>
                        <div class="last-updated" id="last-updated">Just now</div>
                    </div>

                    <div class="temp-container">
                        <img id="weather-icon" class="weather-icon" src="" alt="Weather icon">
                        <div class="temperature">
                            <span id="temp">--</span><span class="unit">°C</span>
                        </div>
                    </div>

                    <div class="condition" id="condition">--</div>

                    <div class="weather-details">
                        <div class="detail-card">
                            <i class="fas fa-wind"></i>
                            <div class="value" id="wind">-- km/h</div>
                            <div class="label">Wind Speed</div>
                        </div>
                        <div class="detail-card">
                            <i class="fas fa-tint"></i>
                            <div class="value" id="humidity">--%</div>
                            <div class="label">Humidity</div>
                        </div>
                        <div class="detail-card">
                            <i class="fas fa-compress-alt"></i>
                            <div class="value" id="pressure">-- hPa</div>
                            <div class="label">Pressure</div>
                        </div>
                        <div class="detail-card">
                            <i class="fas fa-eye"></i>
                            <div class="value" id="visibility">-- km</div>
                            <div class="label">Visibility</div>
                        </div>
                    </div>
                </div>

                <div class="forecast">
                    <h3 class="section-title">5-Day Forecast</h3>
                    <div class="forecast-cards" id="forecast-container">
                        <!-- Forecast cards will be inserted here -->
                    </div>
                </div>
            </div>

            <div class="additional-info">
                <div class="info-card">
                    <h3>Hourly Forecast</h3>
                    <div class="hourly-forecast" id="hourly-forecast">
                        <!-- Hourly forecast items will be inserted here -->
                    </div>
                </div>
                <div class="info-card">
                    <h3>Air Quality</h3>
                    <div class="air-quality" id="air-quality">
                        <div class="detail-card">
                            <i class="fas fa-smog"></i>
                            <div class="value" id="aqi">--</div>
                            <div class="label">AQI Index</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>Powered by WeatherAPI.com | © 2023 WeatherSphere Pro</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
